name: CI

on:
  push:
    branches: [main, "epic/**"]
  pull_request:
    branches: [main, "epic/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Biome + the no-unsafe-type-assertion GritQL plugin (plugins/*.grit):
      # bans `as T` type assertions across the authored TS source. Regenerate
      # locally with `npm run lint`.
      - run: npm run lint

      # Guard against schema drift: the App-manifest shape is owned by
      # `@nanobpm/nano-app-schema` (Magikcraft/nano-bpm spec-app). Augmenting its
      # types here (`declare module "@nanobpm/nano-app-schema"`) lets a field pass
      # editor/type checks while the published JSON Schema still rejects it — the
      # exact drift that hid `models.templates` from Nano Studio. Formalize new
      # fields in the schema package and bump the dep instead.
      - name: Ban manifest-shape schema augmentations
        run: |
          if grep -rnE "declare[[:space:]]+module[[:space:]]+['\"]@nanobpm/nano-app-schema['\"]" packages/*/src; then
            echo "::error::Do not augment @nanobpm/nano-app-schema types; formalize the field in the schema package (spec-app) and bump the dependency."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - run: npm run typecheck
      - run: npm test --if-present

      # The served browser page runtime lives as real, type-checked/linted source
      # (packages/urban/src/runtime/browser/runtime.browser.js) and is emitted into
      # a committed generated artifact (runtime.gen.ts) by scripts/gen-runtime.mjs.
      # Re-generate here and fail on any drift so a stale artifact can never ship.
      # Regenerate + commit locally with `npm run gen:runtime -w packages/urban`.
      - name: Runtime artifact is up to date
        run: |
          npm run gen:runtime -w packages/urban
          git diff --exit-code -- packages/urban/src/runtime/core/modules/runtime.gen.ts

      # The MCP tool surface (ADR 0067) is PROJECTED from the OpenAPI spec by the
      # single walker in packages/urban/src/openapi/spec.ts. A silent change to
      # that projection — an operation starting/stopping being a tool, flipping
      # read↔mutating, or gaining/losing its `x-mcp` exclusion — is a security-
      # relevant surface change. The projection is captured as a committed
      # snapshot (mcp-tools.snapshot.json) and this step fails on any spec↔tool
      # skew. Regenerate + commit locally with `npm run gen:mcp-tools -w packages/urban`.
      - name: MCP tool projection is in parity with the spec
        run: npm run check:mcp -w packages/urban

      # `check:mcp` above pins the projection over a minimal SYNTHETIC fixture — which is exactly
      # why the `$ref`-body defect shipped (the fixture never contained a `$ref`-bodied op, a real
      # consumer spec does). This step holds the SAME projection to VENDORED, pinned, REAL consumer
      # `openapi.yaml` documents (nano-workforce first) and fails the build if any projected tool is
      # not self-contained (P0 #502) or an object body would not round-trip (P1 #503). No running
      # instance needed. See packages/urban/src/openapi/consumer-specs/README.md.
      - name: MCP projection conforms over real consumer specs
        run: npm run check:mcp-conformance -w packages/urban

  # db/migrations/*.sql are forward-only and applied in lexical filename order, so
  # the numeric prefix is load-bearing (see scripts/lib/migration-order.mjs). Two
  # branches that fork off the same state can each pick "the next free prefix N"
  # and both emit N_*.sql — each PR is green alone, but the pair collides on merge
  # with a non-deterministic apply order that no single PR's CI exercises (the
  # wave-2 collision hand-sequenced 001/002/003 in epic #124). This job catches
  # the class mechanically. Run locally with `npm run check:migrations`.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: node scripts/check-migrations.mjs

  # The Nano agentic protocol's wire contract is authored once as a shared
  # conformance corpus (S0, #126) that BOTH this repo's codec and the cross-repo
  # c8ctl client are held to — a shared prose spec does not stop divergence, shared
  # adversarial test vectors do. This job runs that corpus through the single
  # canonical entry point (`npm run test:conformance`, which fans out to every
  # workspace's `test:conformance` script). It is a green no-op until S0 publishes
  # its package, then exercises the real golden vectors with no further CI edit.
  # See docs/nano-agentic-protocol.md §7.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:conformance

  # The Urban stack ships as source .ts and must run on Deno as well as Node
  # (ADR 0052/0053: hosts are interchangeable). This job proves the dual-runtime
  # contract by running the Deno test suite.
  urban-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Build the workspace deps the Urban source imports (e.g. @nanobpm/workflow's
      # dist), which the Deno suite now loads transitively via model derivation.
      - run: npm run build
      - name: Deno test — @nanobpm/urban
        run: npm run test:deno -w packages/urban

  # The `intellisense` block in each language pack's nano-ide.ext.json is a
  # committed, generated artifact — derived from the pack's SDK's own strongly
  # typed metadata (C# XML docs, Python introspection, Rust rustdoc JSON). This
  # job re-runs every generator in `--check` mode so a stale manifest (e.g. after
  # an SDK version bump) fails CI instead of silently shipping outdated
  # IntelliSense. Regenerate + commit with `npm run gen:intellisense`.
  intellisense:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # C# — populate the NuGet cache so the SDK's Camunda.Orchestration.Sdk.xml
      # (the derive source) is on disk. Version is pinned exactly in the csproj.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore C# SDK (fills the doc-XML cache)
        run: dotnet restore packages/lang-csharp/templates/csharp-starter

      # Python — install the SDK so introspection can import it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python SDK
        run: pip install "camunda-orchestration-sdk>=9,<10"

      # Rust — nightly is required for rustdoc JSON (-Z unstable-options). The
      # generator builds --locked against the template's committed Cargo.lock, so
      # the derived output is deterministic (SDK pinned to 0.2.2).
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/lang-rust/templates/rust-starter

      - name: Check IntelliSense manifests are up to date
        run: npm run check:intellisense --workspaces --if-present
        env:
          # Build rustdoc into the template's own target dir so rust-cache
          # (keyed on that workspace) can persist the artifacts across runs.
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/lang-rust/templates/rust-starter/target

