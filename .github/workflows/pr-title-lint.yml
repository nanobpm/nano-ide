name: PR title lint

# main is squash-merged, so the PR title becomes the commit subject on `main`.
# release-please reads those subjects as Conventional Commits to decide each
# package's next version (feat -> minor, fix/perf -> patch, `!`/BREAKING ->
# major; other types land but don't bump). A non-conventional title lands on
# `main` and is silently ignored by the release automation — so gate the title
# against the Conventional Commits grammar here. Do NOT bump versions by hand;
# the release PR does that (see .github/workflows/release-please.yml).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in lockstep with release-please's conventional-commits parser.
          types: |
            feat
            fix
            perf
            build
            chore
            ci
            docs
            refactor
            revert
            style
            test
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
