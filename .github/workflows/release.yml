name: Release

# Gate publishing on a green CI run. Instead of firing on every push to main,
# this workflow triggers when the "CI" workflow *completes* on main, and the
# release job only runs when that CI run concluded successfully. This makes it
# impossible to publish from main with failing CI. The filename stays
# release.yml because the npm Trusted Publisher (OIDC) config is keyed to it.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# `contents: write` lets scripts/publish.mjs cut the per-package GitHub Release
# that serves as the `capability -> version` provenance index (nano-workforce#263).
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Only publish when the triggering CI run passed on main.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Check out the exact commit CI validated, not the branch tip, so we
          # never publish a commit that CI has not (yet) passed on.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history + tags: publish.mjs derives each release's provenance
          # (issues/PRs since the package's previous `<name>@<version>` tag) from
          # git log, so it needs the tags and the commit range, not a shallow tip.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # actions/setup-node writes a legacy `always-auth` key into the npmrc it
      # generates for registry auth. npm >= 11 (installed below) rejects it as
      # an unknown config and prints a warning on every invocation; this project
      # does not allow warnings. Strip it — registry auth still works via the
      # `//registry.npmjs.org/:_authToken` line that setup-node also writes.
      - name: Strip legacy always-auth from generated npmrc
        run: sed -i '/^always-auth=/d' "$NPM_CONFIG_USERCONFIG"
      # Trusted Publisher (OIDC) support needs npm >= 11.5.1; node 22 LTS ships
      # with npm 10.x which still requires a long-lived NPM_TOKEN.
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      # Publishes each workspace whose version isn't on npm yet (idempotent), then
      # ensures a GitHub Release (the `capability -> version` provenance index,
      # nano-workforce#263) exists for it. Auth is via GitHub Actions OIDC — the
      # workflow's id-token is exchanged for a short-lived npm publish token per
      # package, so no long-lived NPM_TOKEN secret is needed. Each target package
      # on npm must have the matching Trusted Publisher configured (repo:
      # nanobpm/nano-ide, workflow: release.yml). Provenance is signed
      # automatically. GH_TOKEN authorises `gh release create` (persist-credentials
      # is false, so gh cannot fall back to the git remote's credentials).
      - run: node scripts/publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
