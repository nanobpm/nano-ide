# Parity-guard fixture (ADR 0067 Slice 3) — NOT an app spec.
#
# This is the input to the spec↔tool parity guard (`scripts/gen-mcp-tools.ts`).
# It exercises every branch of the MCP tool projection with a stable, minimal
# document so `check:mcp` fails loudly the moment the walker's projection changes
# without a matching, reviewed regeneration of `mcp-tools.snapshot.json`:
#
#   - a READ operation (GET)            → projected, non-mutating
#   - a MUTATING operation (POST)       → projected, mutating (guarded at runtime)
#   - an `x-mcp`-EXCLUDED operation      → present in the doc but withheld from the
#                                          agent-facing tool surface (the security-
#                                          relevant opt-out, `x-mcp: false`)
#   - a `$ref`-BODIED operation (POST)   → its request body is a bare
#                                          `{ $ref: #/components/schemas/... }` with
#                                          no inline `type`, whose referenced
#                                          component itself nests another `$ref`.
#                                          The projection must inline both so the
#                                          tool's `inputSchema.properties.body` is
#                                          self-contained (no `$ref`, explicit
#                                          `type`) — an MCP client cannot resolve
#                                          `#/components/...` outside this document.
#   - an INLINE object-body op (POST)    → its request body declares `type: object`
#                                          inline, exercising the faithful object-body
#                                          transport path (object arg → door receives
#                                          an object; a pre-encoded JSON string is
#                                          parsed, not double-encoded).
#
# Edit this fixture ONLY together with a reviewed `npm run gen:mcp-tools`.
openapi: 3.1.0
info:
  title: mcp-parity-fixture
  version: 0.0.0
components:
  securitySchemes:
    appSecret:
      type: apiKey
      in: header
      name: X-Nano-Key
      x-nano-secret-env: NANO_WEBHOOK_KEY
  schemas:
    # A request-body schema declared as a bare `$ref` with NO inline `type` — the exact shape that
    # leaked an unresolved `#/components/...` pointer into a tool's inputSchema before it was resolved
    # on the projection path (the motivating real op `previewDeliveryGraph`). It also NESTS another
    # `$ref` (`root`) so deep resolution is exercised, not just a single top-level hop.
    DeliveryGraphSubmit:
      type: object
      required:
        - root
      properties:
        root:
          $ref: "#/components/schemas/DeliveryNode"
        note:
          type: string
    DeliveryNode:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        weight:
          type: integer
          minimum: 0
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: List widgets (read — projected, unguarded on loopback).
      responses:
        "200":
          description: ok
    post:
      operationId: createWidget
      summary: Create a widget (mutating — projected, guarded).
      security:
        - appSecret: []
      responses:
        "201":
          description: created
  /internal/reindex:
    post:
      operationId: reindexWidgets
      summary: Operator-only reindex (withheld from the MCP tool surface).
      x-mcp: false
      responses:
        "202":
          description: accepted
  /delivery-graph/preview:
    post:
      operationId: previewDeliveryGraph
      summary: Preview a delivery graph (mutating — `$ref`-bodied, body must resolve to a self-contained schema).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryGraphSubmit"
      responses:
        "200":
          description: ok
  /widgets/bulk:
    post:
      operationId: bulkCreateWidgets
      summary: "Bulk create widgets (mutating — inline `type: object` request body, object-arg round-trip case)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: string
                dryRun:
                  type: boolean
      responses:
        "201":
          description: created
